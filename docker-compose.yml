services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DB:-appointy}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      # Inside Compose the DB hostname is the mysql service, not localhost
      DB_DIALECT: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      NODE_ENV: production
      # Force re-login for pre-claim JWTs in containerized production
      JWT_ACCEPT_LEGACY: 'false'
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:4000}
    ports:
      - "5173:80"
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:4000}
        VITE_CURRENCY: ${VITE_CURRENCY:-PKR}
        VITE_PATIENT_URL: ${VITE_PATIENT_URL:-http://localhost:5173}
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  mysql_data:
